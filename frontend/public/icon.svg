<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080d1a"/>
      <stop offset="100%" stop-color="#0b1120"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="coreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#fb7185"/>
    </linearGradient>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#1e293b" stroke-width="4"/>

  <!-- Radar sweep circles -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#0e1726" stroke-width="2"/>
  <circle cx="256" cy="256" r="120" fill="none" stroke="#111d33" stroke-width="2"/>

  <!-- Main Cyber Shield -->
  <path d="M 256 90 L 390 145 C 390 270 256 390 256 390 C 256 390 122 270 122 145 Z" 
        fill="url(#shieldGrad)" fill-opacity="0.12" 
        stroke="url(#shieldGrad)" stroke-width="16" stroke-linejoin="round"/>

  <!-- Inner Threat Warning Core -->
  <path d="M 256 160 L 330 300 L 182 300 Z" 
        fill="url(#coreGrad)" fill-opacity="0.2" 
        stroke="url(#coreGrad)" stroke-width="12" stroke-linejoin="round"/>
  
  <line x1="256" y1="200" x2="256" y2="245" stroke="#f43f5e" stroke-width="12" stroke-linecap="round"/>
  <circle cx="256" cy="275" r="7" fill="#f43f5e"/>

  <!-- Text SecDash -->
  <text x="256" y="445" fill="#38bdf8" font-family="monospace" font-size="36" font-weight="bold" text-anchor="middle" letter-spacing="4">SECDASH</text>
</svg>
